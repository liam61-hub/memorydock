name: Public CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  package:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: 22
          - os: ubuntu-latest
            node: 24
          - os: windows-latest
            node: 22
          - os: windows-latest
            node: 24
          - os: macos-latest
            node: 22
          - os: macos-latest
            node: 24
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci --registry=https://registry.npmjs.org
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build:admin
      - run: npm run build
      - run: npm run smoke:package
      - if: matrix.os == 'ubuntu-latest' && matrix.node == 24
        run: npm audit --registry=https://registry.npmjs.org --omit=dev --audit-level=high

  security:
    name: Semgrep security scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install semgrep
      - run: semgrep scan --config p/security-audit --error server site scripts

  site:
    name: Static site smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install playwright
      - run: python -m playwright install --with-deps chromium
      - name: Run browser smoke test
        run: |
          set -euo pipefail
          python -m http.server 8080 --directory site >/tmp/memorydock-site.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in {1..20}; do
            if curl --fail --silent http://localhost:8080/ >/dev/null; then
              break
            fi
            sleep 0.25
          done
          curl --fail --silent http://localhost:8080/ >/dev/null
          python site/.smoke-test.py
