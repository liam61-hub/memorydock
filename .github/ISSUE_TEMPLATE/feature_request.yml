name: Feature request
description: Suggest a new capability or workflow improvement
title: "[Feature] "
labels: [enhancement]
body:
  - type: textarea
    id: use_case
    attributes:
      label: What are you trying to do?
      description: Describe the user workflow and why current behavior falls short.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Suggested behavior
    validations:
      required: false
